<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Student ID – UI Mockup</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&family=Roboto+Slab:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <h1>Student ID</h1>
    </header>

    <main class="card">
      <span class="sample-tag" aria-label="Design mockup, not a valid ID">SAMPLE · UI MOCKUP</span>

      <div class="photo-frame">
        <!-- Placeholder avatar: swap for any stock/placeholder image -->
        <div class="photo" role="img" aria-label="Student photo placeholder">
          <svg viewBox="0 0 100 100" aria-hidden="true">
            <circle cx="50" cy="38" r="18"/>
            <path d="M14 100c0-22 16-36 36-36s36 14 36 36z"/>
          </svg>
        </div>
      </div>

      <section class="details">
        <p class="surname">Lastname</p>
        <p class="firstname">Firstname</p>
        <p class="dob">d.o.b. 01.01.2000</p>
        <p class="school">Example University of Applied Sciences</p>
        <p class="status">VALID</p>
        <p class="period">01.08.2025 - 31.07.2026</p>
      </section>

      <section class="partners" aria-label="Partner logos">
        <div class="partner partner-a">Partner&nbsp;A</div>
        <div class="partner partner-b">P·B</div>
        <div class="partner partner-c"><span class="ring"></span>Partner&nbsp;C</div>
      </section>
    </main>

    <div class="infobar">
      <button class="icon-btn" aria-label="Settings">
        <svg viewBox="0 0 24 24"><path d="M19.4 13a7.5 7.5 0 0 0 0-2l2.1-1.6-2-3.4-2.5 1a7.4 7.4 0 0 0-1.7-1L15 3.3h-4l-.4 2.7a7.4 7.4 0 0 0-1.7 1l-2.5-1-2 3.4L6.6 11a7.5 7.5 0 0 0 0 2l-2.1 1.6 2 3.4 2.5-1c.5.4 1.1.8 1.7 1l.4 2.7h4l.4-2.7c.6-.2 1.2-.6 1.7-1l2.5 1 2-3.4zM12 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z"/></svg>
      </button>
      <span class="timestamp">1.1.2026, 12.00.00</span>
      <button class="icon-btn" aria-label="QR code">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 8V3h5M16 3h5v5M21 16v5h-5M8 21H3v-5"/><rect x="7" y="7" width="4" height="4"/><rect x="13" y="7" width="4" height="4"/><rect x="7" y="13" width="4" height="4"/><path d="M13 13h2v2h2v2h-4z"/></svg>
      </button>
    </div>

    <nav class="bottomnav" aria-label="Main">
      <a href="#" aria-label="Home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11 12 3l9 8v10h-6v-6H9v6H3z"/></svg></a>
      <a href="#" aria-label="Offers"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12V3h9l9 9-9 9z"/><path d="M12 10.5c1-1.5 3.5-.5 2.5 1.5L12 14.5 9.5 12c-1-2 1.5-3 2.5-1.5z" fill="currentColor"/></svg></a>
      <a href="#" aria-label="Services"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V4h6v3M3 13h18M11 12h2v2h-2z"/></svg></a>
      <a href="#" class="active" aria-current="page" aria-label="Student ID"><svg viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="2" fill="currentColor"/><circle cx="8" cy="11" r="2" fill="#fff"/><path d="M4.5 16c.5-2 2-3 3.5-3s3 1 3.5 3zM13 10h6M13 13h6" stroke="#fff" stroke-width="1.6"/></svg></a>
      <a href="#" aria-label="Menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg></a>
    </nav>
  </div>
</body>
</html>
